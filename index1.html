<!DOCTYPE html>
<html lang="en">
<head>
	<base target="_top">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	
	<title>Sondos Locator</title>
	
	<link rel="shortcut icon" type="image/x-icon" href="docs/images/favicon.ico" />

  


<link rel="stylesheet" href="js/leaflet/dist/leaflet.css"  />

     <script src="js/leaflet/dist/leaflet.js"></script>

		html, body {
			height: 100%;
			margin: 0;
		}

			width: 1200px;
			max-width: 100%;

<body>
<div class="control-panel">
        <label for="lat">Latitude:</label>
        <input type="text" id="lat" value="51.505" placeholder="e.g. 51.505">
        
        <label for="lng">Longitude:</label>
        <input type="text" id="long" value="-0.09" placeholder="e.g. -0.09">
        
         
        
        <button id="button">Go to Location</button>
    </div>


<div id="map" style="width: 1200px; height: 800px; "></div>
