<!DOCTYPE html>
<html lang="en">
<head>
	<base target="_top">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	
	<title>Sondos Locator</title>
	
	<link rel="shortcut icon" type="image/x-icon" href="docs/images/favicon.ico" />

  


 <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
 
	<style>
		html, body {
			height: 100%;
			margin: 0;
		}
		.leaflet-container {
			height: 400px;
			width: 600px;
			max-width: 100%;
			max-height: 100%;
		}
	</style>

	
</head>


<body>
<div class="control-panel">
        <label for="lat">Latitude:</label>
        <input type="text" id="lat" value="51.505" placeholder="e.g. 51.505">
        
        <label for="lng">Longitude:</label>
        <input type="text" id="long" value="-0.09" placeholder="e.g. -0.09">
        
         
        
        <button id="button">Go to Location</button>
    </div>


<div id="map" style="width: 600px; height: 400px; "></div>
 

  

<script src="js/mapscript1.js"></script>
	
</script>
     




</body>
</html>
